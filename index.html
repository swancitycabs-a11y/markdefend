<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarkDefend | Under Maintenance</title>
  <meta name="description" content="MarkDefend is building a smarter way for Australian businesses to protect, monitor and manage their brands." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a0f;
      --panel: rgba(255,255,255,.045);
      --text: #f5f7fb;
      --muted: #9aa4b2;
      --line: rgba(255,255,255,.1);
      --accent: #d7b56d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 20% 20%, rgba(215,181,109,.08), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.04), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(860px, 100%); }
    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: clamp(32px, 6vw, 64px);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 44px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 14px;
    }
    .mark {
      width: 34px;
      height: 34px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 800;
    }
    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(46px, 8vw, 86px);
      line-height: .98;
      letter-spacing: -.045em;
    }
    p {
      margin: 28px 0 0;
      max-width: 650px;
      color: var(--muted);
      font-size: clamp(18px, 2.5vw, 22px);
      line-height: 1.6;
    }
    .footer {
      margin-top: 44px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .status { display: inline-flex; align-items: center; gap: 8px; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(215,181,109,.65);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">
        <div class="mark">M</div>
        <span>MarkDefend</span>
      </div>

      <div class="eyebrow">Website under maintenance</div>
      <h1>Protect what you build.</h1>
      <p>
        We’re currently updating our website to improve your experience. Thank you for your patience.
      </p>

      <div class="footer">
        <div class="status"><span class="dot"></span><span>Under maintenance</span></div>
        <div>MarkDefend</div>
      </div>
    </section>
  </main>
</body>
</html>
